<!doctype html>
<html lang="ko" data-hwp-extension="rhwp" data-hwp-extension-version="0.8.7"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>도감</title>
<link id="page-fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&amp;family=Poor+Story&amp;family=Gaegu:wght@400;700&amp;family=Jua&amp;family=Gowun+Dodum&amp;family=Hi+Melody&amp;display=swap">
<style id="page-style">
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
@font-face{font-family:"DulgiMayo";src:url("fonts/Dovemayo-Medium.woff") format("woff");font-weight:400 500;font-display:swap}
@font-face{font-family:"DulgiMayo";src:url("fonts/Dovemayo-Bold.woff") format("woff");font-weight:600 800;font-display:swap}
/* Layout: one small centered column. Avatar with name beside it, a small menu box, a dashed tab over one text box, a soft music player at the bottom. Greys only. */
:root{
  --bg:#F7F7F7; --panel:#FFFFFF; --line:#5C5C5C; --soft:#D0D0D0; --chip:#EDEDED; --ink:#2E2E2E; --muted:#8A8A8A;
  --pl:#F0F0F0; --pl-btn:#FFFFFF; --pl-track:#E2E2E2; --pl-ico:#7A7A7A;
  --kr:"Poor Story";
  --font:"Roboto",var(--kr),"Apple SD Gothic Neo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1C1C; --panel:#232323; --line:#8C8C8C; --soft:#444444; --chip:#2E2E2E; --ink:#E4E4E4; --muted:#9A9A9A;
  --pl:#2A2A2A; --pl-btn:#383838; --pl-track:#454545; --pl-ico:#B5B5B5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1C1C; --panel:#232323; --line:#8C8C8C; --soft:#444444; --chip:#2E2E2E; --ink:#E4E4E4; --muted:#9A9A9A;
  --pl:#2A2A2A; --pl-btn:#383838; --pl-track:#454545; --pl-ico:#B5B5B5; color-scheme:dark}

body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.85}
#app{max-width:460px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:36px 90px;
  display:flex;flex-direction:column;gap:18px;font-family:var(--font)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* profile */
.prof{display:flex;gap:16px;align-items:center}
.ava{flex:none;width:92px;height:92px;padding:6px;border:1px solid var(--line);background:var(--panel);display:block;position:relative}
.ava .in{width:100%;height:100%;overflow:hidden;display:grid;place-items:center;background:repeating-conic-gradient(var(--chip) 0 25%,var(--panel) 0 50%) 0 0/8px 8px}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
.ava .ini{font-size:28px;color:var(--muted)}
.who{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.nick{margin:0;font-size:19px;font-weight:500;line-height:1.3;overflow-wrap:anywhere}
.subt{font-size:12.5px;color:var(--muted);line-height:1.5;overflow-wrap:anywhere}
.sns{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.sns a,.sns .ic{width:26px;height:26px;display:grid;place-items:center;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.sns a:hover{background:var(--chip)}
.sns svg{width:14px;height:14px}
.sns img{width:15px;height:15px;object-fit:contain;display:block}

/* menu */
.menu{border:1px solid var(--line);background:var(--panel);padding:7px 10px}
.menu ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:0 14px}
.menu button{padding:1px 2px;letter-spacing:.06em;font-size:12px;color:var(--muted);text-transform:uppercase}
.menu button[aria-current="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.menu button:hover{color:var(--ink)}
.menu .child::before{content:"└ ";color:var(--muted)}

/* text box */
.page{min-width:0}
.tab{display:inline-block;border:1px dashed var(--line);border-bottom:none;padding:3px 12px 2px;letter-spacing:.22em;font-size:11.5px;background:var(--panel);text-transform:uppercase;position:relative;top:1px;max-width:100%;overflow-wrap:anywhere}
.box{border:1px solid var(--line);background:var(--panel);padding:14px 16px 16px}
.txt p{margin:0;min-height:1.85em;overflow-wrap:anywhere}
.txt .li{padding-left:1.1em;text-indent:-1.1em}
.txt .li::before{content:"·";display:inline-block;width:1.1em;text-indent:0;text-align:center;font-weight:700}

/* player */
.pl{background:var(--pl);border-radius:12px;padding:12px 16px 14px;display:flex;flex-direction:column;gap:10px;position:relative}
.pl-min{position:absolute;top:4px;right:8px;width:24px;height:22px;display:grid;place-items:center;color:var(--pl-ico)}
.pl-min::before{content:"";width:11px;height:2px;background:currentColor;border-radius:1px}
.pl.mini .pl-min::before{height:9px;width:9px;background:none;border:2px solid currentColor;border-radius:2px}
.pl-title{align-self:center;background:var(--pl-btn);border-radius:999px;padding:4px 18px;font-size:13px;color:var(--ink);max-width:calc(100% - 36px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-note{text-align:center;font-size:11px;color:var(--muted);margin-top:-6px}
.pl-track{display:flex;flex-direction:column;gap:2px}
.pl input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:14px;background:transparent;margin:0;cursor:pointer}
.pl input[type=range]::-webkit-slider-runnable-track{height:5px;border-radius:3px;background:linear-gradient(var(--pl-ico),var(--pl-ico)) 0/var(--p,0%) 100% no-repeat,var(--pl-track)}
.pl input[type=range]::-moz-range-track{height:5px;border-radius:3px;background:var(--pl-track)}
.pl input[type=range]::-moz-range-progress{height:5px;border-radius:3px;background:var(--pl-ico)}
.pl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--pl-btn);border:1px solid var(--soft);margin-top:-3.5px}
.pl input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--pl-btn);border:1px solid var(--soft)}
.pl input.vol::-webkit-slider-thumb{width:16px;height:16px;margin-top:-5.5px;background:var(--soft);border:none}
.pl input.vol::-moz-range-thumb{width:16px;height:16px;background:var(--soft);border:none}
.pl input:disabled{opacity:.5;cursor:default}
.pl-time{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.pl-ctl{display:flex;justify-content:center;gap:18px}
.pl-ctl button,.pl-ctl a{width:34px;height:34px;border-radius:50%;background:var(--pl-btn);display:grid;place-items:center;color:var(--pl-ico)}
.pl-ctl svg{width:13px;height:13px}
.pl-ctl .dis{opacity:.4;cursor:default}
.pl-vol{display:flex;align-items:center;gap:12px;padding:0 4px;color:var(--soft)}
.pl-vol svg{flex:none;width:16px;height:16px;color:var(--soft)}
.pl.mini{background:transparent;border-radius:0;padding:0 26px 0 0}
.pl.mini .pl-title,.pl.mini .pl-ctl,.pl.mini .pl-vol,.pl.mini .pl-note,.pl.mini .pl-time{display:none}
.pl.mini .pl-min{top:50%;right:0;transform:translateY(-50%);width:20px;height:20px}
.pl.mini .pl-min::before{width:7px;height:7px;border:none;border-left:1.5px solid currentColor;border-top:1.5px solid currentColor;border-radius:0;background:none;transform:translateY(2px) rotate(45deg)}

/* photo grid */
.pics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pic{position:relative;aspect-ratio:1;max-width:100%;border-radius:10px;overflow:hidden;background:var(--soft);display:block;width:100%}
.pic img{width:100%;height:100%;object-fit:cover;display:block}
.pic:has(img){background:#FFFFFF}
.zoom img{background:#FFFFFF}
.pics.one{grid-template-columns:minmax(0,1fr)}
.pics.one .pic{aspect-ratio:4/3}
.pic .plus{position:absolute;inset:0;display:grid;place-items:center;color:var(--panel);font-size:22px;line-height:1}
.pic-x{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--panel);font-size:12px;line-height:20px;text-align:center}
.zoom{position:fixed;inset:0;z-index:40;background:rgba(20,20,20,.86);display:grid;place-items:center;padding:calc(24px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
.zoom img{max-width:100%;max-height:100%;object-fit:contain}

/* editing */
.ed-area{width:100%;min-height:220px;resize:vertical;border:1px dashed var(--muted);background:var(--panel);padding:6px 8px;line-height:1.85;font-family:var(--font);font-size:14px}
.ed-in{border:1px dashed var(--muted);background:var(--panel);padding:2px 6px;min-width:0;font-size:13px}
.ed-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;width:100%}
.ed-row .ed-in{flex:1 1 120px}
.who .ed-in{width:100%}
.sb{border:1px solid var(--line);background:var(--panel);padding:1px 8px;font-size:12px;line-height:1.8;font-family:"Roboto",var(--kr),sans-serif}
.sb:hover{background:var(--chip)}
.sb.on{background:var(--ink);color:var(--panel)}
.sb.wide{width:100%;padding:6px}
.panel{border:1px dashed var(--soft);padding:12px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.panel h3{margin:0;font-size:12px;color:var(--muted);font-weight:400;letter-spacing:.08em}
.help{font-size:11.5px;color:var(--muted);margin:0;line-height:1.6}
.hint{position:absolute;left:6px;right:6px;bottom:6px;background:var(--ink);color:var(--panel);font-size:10.5px;text-align:center}
select.ed-in{padding:3px 4px}
.song-ed{border-top:1px dotted var(--soft);padding-top:8px}
.song-ed:first-of-type{border-top:none;padding-top:0}

.bar{position:fixed;right:max(16px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:5px;background:var(--panel);border:1px solid var(--line);padding:4px}
.bar .msg{font-size:12px;color:var(--muted);padding:0 4px}
.btn{border:1px solid var(--line);padding:3px 12px;font-size:13px;background:var(--panel)}
.btn.primary{background:var(--ink);color:var(--panel);border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:default}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--panel);padding:7px 12px;font-size:13px;max-width:calc(100% - 32px)}
</style>
</head>

      case "prev": case "next":
        var was = isPlaying();
        si = (si + (act === "next" ? 1 : -1) + songs.length) % songs.length;
        loadSong(was); render();
        return;
      case "edit": editing = true; break;
      case "cancel": state = JSON.parse(original); norm(); editing = false; try { localStorage.removeItem(KEY); } catch (e) {} break;
      case "save": save(); return;
      case "img": pick("img", 0, "image/*"); return;
      case "sfile": pick("song", i, "audio/*,video/mp4,.mp3,.m4a,.mp4"); return;
      case "sfiledel": songs[i].file = ""; break;
      case "sadd": songs.push({id: uid(), title: "", yt: "", file: ""}); break;
      case "sdel": songs.splice(i, 1); if (si >= songs.length) si = 0; loadedKey = "__"; break;
      case "sup": songs.splice(i - 1, 0, songs.splice(i, 1)[0]); break;
      case "up": pages.splice(cur - 1, 0, pages.splice(cur, 1)[0]); cur--; break;
      case "down": pages.splice(cur + 1, 0, pages.splice(cur, 1)[0]); cur++; break;
      case "child": pages[cur].child = !pages[cur].child; break;
      case "pdel": pages.splice(cur, 1); cur = Math.max(0, cur - 1); break;
      case "padd": pages.push({id: uid(), menu: "NEW", tab: "NEW", child: false, body: ""}); cur = pages.length - 1; break;
      case "ladd": p.links.push({type: "x", url: ""}); break;
      case "ldel": p.links.splice(i, 1); break;
      case "licon": pick("icon", i, "image/*"); return;
      case "licondel": delete p.links[i].icon; break;
      case "font": state.font = b.getAttribute("data-f"); break;
      case "cfup": if (!state.cfont) state.cfont = {name: "", url: ""}; pick("font", 0, ".ttf,.otf,.woff,.woff2,font/ttf,font/otf,font/woff,font/woff2"); return;
      case "cfdel": state.cfont = {name: (state.cfont && state.cfont.name) || "", url: ""}; if (state.font === "custom") state.font = "poor"; break;
      default: return;
    }
    render();
  });

  function buildDoc(){
    var root = document.documentElement.cloneNode(true);
    root.removeAttribute("style");
    var a = root.querySelector("#app"); if (a) a.innerHTML = "";
    ["#file-upload", ".toast", "#cfont-face", "#yt-holder"].forEach(function(q){ var n = root.querySelector(q); if (n) n.remove(); });
    root.querySelectorAll("script[src]").forEach(function(n){ n.remove(); });
    root.querySelector("#state").textContent = JSON.stringify(state).replace(/</g, "\\u003c");
    return "<!doctype html>\n" + root.outerHTML;
  }

  function save(){
    if (busy) return;
    var blob = new Blob([buildDoc()], {type: "text/html"}), u = URL.createObjectURL(blob), link = document.createElement("a");
    link.href = u; link.download = "index.html"; document.body.appendChild(link); link.click(); link.remove();
    setTimeout(function(){ URL.revokeObjectURL(u); }, 4000);
    toast("index.html을 받았어요. GitHub 저장소에 올리면 반영돼요");
  }

  document.addEventListener("keydown", function(e){ if (e.key === "Escape" && zoom) { zoom = ""; render(); } });
  render();
})();
</script>
